<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Binary Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&amp;family=Noto+Sans+Hebrew:wght@300;400;600&amp;family=Noto+Sans+Arabic:wght@300;400;600&amp;family=Noto+Serif+Tibetan:wght@300;400;600&amp;family=Noto+Sans+JP:wght@300;400;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design/tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bt-root t-dark s-caps">
  <div class="bt-screen">
    <header class="bt-top">
      <div class="bt-block">
        <div class="bt-k" data-k="title"></div>
        <div class="bt-v" data-k="cal"></div>
        <div class="bt-s" data-k="dateLine"></div>
      </div>
      <div class="bt-block bt-right">
        <div class="bt-k"><span class="bt-pulse" aria-hidden="true"></span><span data-k="locTag"></span></div>
        <div class="bt-v" data-k="l1"></div>
        <div class="bt-s" data-k="l2"></div>
        <div class="bt-s" data-k="l3"></div>
      </div>
    </header>

    <main class="bt-main">
      <div class="bt-row bt-head" aria-hidden="true">
        <div class="bt-label">2ⁿ</div>
        <div class="bt-bits"></div>
        <div class="bt-dec"></div>
      </div>
      <section class="bt-group bt-date"></section>
      <div class="bt-sep" aria-hidden="true"><span></span></div>
      <section class="bt-group bt-time"></section>
    </main>

    <footer class="bt-bottom">
      <div class="bt-block">
        <div class="bt-readout" dir="ltr"><span data-k="readout"></span><span class="bt-ampm" data-k="ampm"></span></div>
        <div class="bt-legend"><span><i class="lg on"></i>1</span><span><i class="lg off"></i>0</span><span dir="ltr" data-k="offset"></span></div>
      </div>
      <nav class="bt-controls">
        <button type="button" class="bt-btn" data-a="lang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span></span></button>
        <button type="button" class="bt-btn" data-a="hf"></button>
        <button type="button" class="bt-btn" data-a="cal"></button>
        <button type="button" class="bt-btn" data-a="loc"></button>
        <button type="button" class="bt-btn" data-a="invert"></button>
      </nav>
    </footer>
  </div>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
