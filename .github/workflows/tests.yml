# Unit tests of the Core and UI packages on the oldest supported macOS that GitHub hosts (26 Tahoe), and an
# arm64 Release build of the .saver. Calendar and date formatting come from the system (ICU), so add a
# runner to the matrix for every major version the saver supports.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: sw_vers && xcodebuild -version && swift --version
      - name: Core tests
        working-directory: Packages/BinaryTimeCore
        run: swift test
      - name: UI tests
        working-directory: Packages/BinaryTimeUI
        run: swift test

  build:
    name: Release build (arm64)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -project BinaryTime.xcodeproj -scheme BinaryTimeSaver -configuration Release \
            -derivedDataPath build/DerivedData build
      - name: Check the binary is arm64 only
        run: |
          bin="build/DerivedData/Build/Products/Release/Binary Time.saver/Contents/MacOS/Binary Time"
          archs=$(lipo -archs "$bin")
          echo "$archs"
          [[ $archs == "arm64" ]]
