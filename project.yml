# XcodeGen spec — regenerate BinaryTime.xcodeproj with `xcodegen generate`.
name: BinaryTime
options:
  bundleIdPrefix: com.binarytime
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: minimal
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    Release:
      ONLY_ACTIVE_ARCH: NO
packages:
  BinaryTimeCore:
    path: Packages/BinaryTimeCore
  BinaryTimeUI:
    path: Packages/BinaryTimeUI
fileGroups:
  - design
  - data
  - Scripts
  - project.yml
targets:
  DebugHost:
    type: application
    platform: macOS
    sources:
      - path: DebugHost
      - path: design/tokens.json
        buildPhase: resources
      - path: data/i18n.json
        buildPhase: resources
      - path: data/celestial-catalog.json
        buildPhase: resources
      - path: data/zone.tab
        buildPhase: resources
      - path: Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: BinaryTimeUI
      - package: BinaryTimeCore
    info:
      path: DebugHost/Info.plist
      properties:
        CFBundleName: DebugHost
        CFBundleDisplayName: Binary Time DebugHost
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.binarytime.DebugHost
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets: []
